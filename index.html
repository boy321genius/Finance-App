<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <title>Finance Tracker</title>
  <meta name="theme-color" content="#0b1220" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Finance" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="description" content="Local-first personal finance tracker" />

  <link rel="manifest" href='data:application/manifest+json,{
    "name":"Finance Tracker","short_name":"Finance","description":"Local-first personal finance tracker",
    "start_url":"./","display":"standalone","background_color":"#0b1220","theme_color":"#0b1220","orientation":"portrait",
    "icons":[{"src":"data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 180 180%22%3E%3Crect width=%22180%22 height=%22180%22 rx=%2240%22 fill=%22%230b1220%22/%3E%3Ctext x=%2290%22 y=%22125%22 font-size=%22100%22 text-anchor=%22middle%22 fill=%22%23ffffff%22%3E$%3C/text%3E%3C/svg%3E","sizes":"180x180","type":"image/svg+xml"}]
  }' />

  <style>
    /* ── (Existing styles unchanged) ── */
    :root { /* ... */ }
    /* ... all existing CSS remains exactly as before ... */
    /* For brevity I've omitted the full CSS here, but it's identical to the provided index-1.html */
  </style>
</head>
<body>

  <div id="bannerContainer" style="position:sticky;top:0;z-index:9;"></div>

  <header class="app-header">
    <div class="header-text">
      <h1 class="app-title" id="appTitle">Finance Tracker</h1>
      <p class="app-subtitle" id="appSubtitle">Loading…</p>
    </div>
    <button class="save-status-chip chip-warn" id="saveStatusChip" type="button" title="No save file linked — click to link one">
      <span class="chip-icon">⚠</span>
      <span id="chipLabel">No File Linked</span>
    </button>
  </header>

  <main class="content">
    <section id="homeView"   class="view active"></section>   <!-- Home now active by default -->
    <section id="logView"    class="view"></section>
    <section id="budgetView" class="view"></section>
    <section id="monthlyView"class="view"></section>
    <section id="annualView" class="view"></section>
    <section id="adminView"  class="view"></section>
    <input id="importFileInput" type="file" accept="application/json" style="display:none;" />
  </main>

  <button class="back-to-top" id="backToTopBtn" aria-label="Back to top" title="Back to top">↑</button>

  <nav class="bottom-nav">
    <button class="nav-btn active" data-view="home">    <div class="nav-icon">🏠</div><span>Home</span></button>
    <button class="nav-btn"        data-view="log">     <div class="nav-icon">➕</div><span>Log</span></button>
    <button class="nav-btn"        data-view="budget">  <div class="nav-icon">📊</div><span>Budget</span></button>
    <button class="nav-btn"        data-view="monthly"> <div class="nav-icon">📅</div><span>Monthly</span></button>
    <button class="nav-btn"        data-view="annual">  <div class="nav-icon">🎯</div><span>Future</span></button>
    <button class="nav-btn"        data-view="admin">   <div class="nav-icon">⚙️</div><span>Admin</span></button>
  </nav>

<script>
// ──────────────────────────────────────────────────────────────────────────────
//  FULL SCRIPT – identical to provided index-1.html, with these additions:
//  1. appSettings.currentBalance
//  2. renderHomeView()
//  3. handleHomeClick()
//  4. Updated nav order and default active view
//  5. Minor adjustments in renderAll() and switchView()
// ──────────────────────────────────────────────────────────────────────────────

// ... (All existing helper functions, loadState, saveState, etc. remain exactly as in the original) ...

// ─── Only the new/modified parts are shown below for clarity ───

// In applyStateObject, ensure currentBalance exists
function applyStateObject(state) {
  // ... existing code ...
  if (!appSettings.currentBalance) appSettings.currentBalance = 0;
  // ... rest unchanged ...
}

// ─── New Home View Rendering ───
function renderHomeView() {
  const container = document.getElementById("homeView");
  const todayKey = formatMonthKey(new Date());
  const monthTxs = months[todayKey]?.transactions || [];

  // Compute income for this month
  const income = monthTxs
    .filter(t => t.category?.toUpperCase() === "INCOME")
    .reduce((s, t) => s + Number(t.amount || 0), 0);

  // Fixed bills & subs (monthly budget)
  const bills = appSettings.recurringBills || [];
  const subs = appSettings.recurringSubscriptions || [];
  const fixedItems = [...bills, ...subs];
  const fixedMonthlyBudget = fixedItems.reduce((s, i) => s + Number(i.budgetAmount || 0), 0);

  // Discretionary budget and actual
  const disc = appSettings.discretionaryCategories || [];
  const discBudget = disc.reduce((s, i) => s + Number(i.budgetAmount || 0), 0);
  const rawActuals = computeActuals(monthTxs);
  const discActual = disc.reduce((s, cat) => s + (rawActuals[cat.name] || 0), 0);
  const discLeft = discBudget - discActual;

  // Remaining after fixed bills
  const remainingAfterFixed = income - fixedMonthlyBudget;

  // Upcoming bills (due within 7 days, not yet paid this month)
  const today = new Date();
  const todayDay = today.getDate();
  const allBillItems = [...bills, ...subs];
  const upcoming = allBillItems
    .filter(item => {
      if (!item.dueDay) return false;
      const diff = item.dueDay - todayDay;
      if (diff < 0 || diff > 7) return false;
      // Check if already paid this month
      const paid = monthTxs.some(tx => tx.category === item.name);
      return !paid;
    })
    .sort((a, b) => a.dueDay - b.dueDay);

  // Recent transactions (last 5, from current month)
  const recent = [...monthTxs]
    .filter(tx => tx.category?.toUpperCase() !== "INCOME") // exclude income from recent list
    .sort((a, b) => b.dateISO.localeCompare(a.dateISO))
    .slice(0, 5);

  // Build HTML
  let html = `
    <div class="card">
      <div class="card-header" style="margin-bottom:4px;">
        <h2 class="card-title">Good ${new Date().getHours() < 12 ? 'Morning' : new Date().getHours() < 18 ? 'Afternoon' : 'Evening'}</h2>
      </div>
      <div class="card-body">
        <div style="display:flex;align-items:baseline;gap:8px;margin-bottom:12px;">
          <span style="font-size:13px;color:var(--color-text-secondary);">Current Balance</span>
          <span id="balanceDisplay" style="font-size:26px;font-weight:800;color:var(--color-primary);cursor:pointer;" data-action="edit-balance">
            ${fmt(appSettings.currentBalance || 0)}
          </span>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;">
          <div class="stat-tile">
            <div class="stat-tile-label">Remaining after bills</div>
            <div class="stat-tile-value" style="color:${remainingAfterFixed >= 0 ? 'var(--color-success)' : 'var(--color-danger)'};">
              ${fmt(remainingAfterFixed)}
            </div>
            <div class="stat-tile-sub">Income ${fmt(income)} − Bills ${fmt(fixedMonthlyBudget)}</div>
          </div>
          <div class="stat-tile">
            <div class="stat-tile-label">Discretionary left</div>
            <div class="stat-tile-value" style="color:${discLeft >= 0 ? 'var(--color-success)' : 'var(--color-danger)'};">
              ${fmt(discLeft)}
            </div>
            <div class="stat-tile-sub">Budget ${fmt(discBudget)} − Spent ${fmt(discActual)}</div>
          </div>
        </div>
      </div>
    </div>
  `;

  // Upcoming Bills
  if (upcoming.length > 0) {
    html += `
      <div class="card">
        <div class="card-header"><h2 class="card-title">📆 Upcoming Bills</h2></div>
        <div class="card-body">
          <div style="display:flex;flex-direction:column;gap:8px;">
    `;
    upcoming.forEach(item => {
      const diff = item.dueDay - todayDay;
      let label = diff === 0 ? "Today" : diff === 1 ? "Tomorrow" : `In ${diff} days`;
      const fullAmount = Number(item.splitFullAmount || 0);
      const yourShare = Number(item.budgetAmount || 0);
      const displayAmount = (item.splitEnabled && fullAmount > 0) ? yourShare : (item.budgetAmount || 0);
      html += `
        <div style="display:flex;align-items:center;justify-content:space-between;background:rgba(10,19,38,0.7);border:1px solid var(--color-border);border-radius:10px;padding:10px 12px;">
          <div>
            <div style="font-size:13px;font-weight:700;color:var(--color-text-primary);">${item.name}</div>
            <div style="font-size:11px;color:var(--color-text-secondary);">${label} · ${fmt(displayAmount)}</div>
          </div>
          <button class="btn btn-sm" data-action="mark-paid" data-id="${item.id}" style="flex-shrink:0;">Paid</button>
        </div>
      `;
    });
    html += `</div></div></div>`;
  } else {
    html += `
      <div class="card">
        <div class="card-header"><h2 class="card-title">📆 Upcoming Bills</h2></div>
        <div class="card-body">
          <p class="text-muted" style="margin:0;">No bills due in the next 7 days.</p>
        </div>
      </div>
    `;
  }

  // Recent Transactions
  html += `
    <div class="card">
      <div class="card-header"><h2 class="card-title">🕐 Recent Transactions</h2></div>
      <div class="card-body">
  `;
  if (recent.length === 0) {
    html += `<p class="text-muted" style="margin:0;">No transactions logged this month.</p>`;
  } else {
    html += `<ul class="tx-list">`;
    recent.forEach(tx => {
      const date = new Date(tx.dateISO);
      const todayStr = new Date().toDateString();
      const yesterdayStr = new Date(Date.now() - 86400000).toDateString();
      let label = date.toDateString() === todayStr ? "Today" :
                  date.toDateString() === yesterdayStr ? "Yesterday" :
                  date.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
      html += `
        <li class="tx-row">
          <div class="tx-row-display">
            <div class="tx-row-left">
              <div class="tx-row-cat">${tx.category}</div>
              <div class="tx-row-meta">${label}${tx.note ? ' · '+tx.note : ''}</div>
            </div>
            <div class="tx-row-right">
              <span class="tx-row-amount" style="color:${tx.amount < 0 ? 'var(--color-success)' : 'var(--color-danger)'};">${fmt(tx.amount)}</span>
            </div>
          </div>
        </li>
      `;
    });
    html += `</ul>`;
  }
  html += `</div></div>`;

  container.innerHTML = html;
}

// ─── Handle Home interactions ───
function handleHomeClick(e) {
  const target = e.target.closest("[data-action]");
  if (!target) return;
  const action = target.dataset.action;

  if (action === "edit-balance") {
    const display = document.getElementById("balanceDisplay");
    const current = appSettings.currentBalance || 0;
    const input = document.createElement("input");
    input.type = "number";
    input.step = "0.01";
    input.value = current;
    input.className = "form-input";
    input.style.fontSize = "26px";
    input.style.fontWeight = "800";
    input.style.width = "160px";
    input.style.padding = "2px 4px";
    input.style.background = "transparent";
    input.style.border = "1px solid var(--color-primary)";
    input.style.borderRadius = "6px";
    input.style.color = "var(--color-primary)";
    display.replaceWith(input);
    input.focus();
    input.select();
    const save = () => {
      const val = parseFloat(input.value);
      if (!isNaN(val)) {
        appSettings.currentBalance = val;
        saveState();
      }
      renderHomeView();
    };
    input.addEventListener("blur", save);
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") { e.preventDefault(); save(); }
    });
    return;
  }

  if (action === "mark-paid") {
    const id = target.dataset.id;
    const allItems = [...(appSettings.recurringBills || []), ...(appSettings.recurringSubscriptions || [])];
    const item = allItems.find(i => i.id === id);
    if (!item) return;

    const todayISO = new Date().toISOString().slice(0, 10);
    const monthKey = todayISO.slice(0, 7);
    ensureMonthExists(monthKey);

    // Determine amount (your share)
    let amount = Number(item.budgetAmount || 0);
    if (item.splitEnabled && Number(item.splitFullAmount) > 0) {
      // Use the budgetAmount as your share (already set)
      amount = Number(item.budgetAmount || 0);
    }
    // If it's annual, we still log the monthly set-aside amount (the transaction is the monthly charge)
    // but the annual logic will handle marking paid later.
    // For simplicity, we just log the budgetAmount.

    const tx = {
      id: uid(),
      dateISO: todayISO,
      category: item.name,
      amount: amount,
      note: "Marked paid from Home"
    };
    months[monthKey].transactions.push(tx);
    saveState();
    renderHomeView();
    return;
  }
}

// ─── Modify renderAll and switchView ───
function renderAll() {
  renderHeader();
  renderActiveView();
}

function renderActiveView() {
  switch (activeView) {
    case "home":    renderHomeView(); break;
    case "log":     renderLogView(); break;
    case "budget":  renderBudgetView(); break;
    case "monthly": renderMonthlyView(); break;
    case "annual":  renderAnnualView(); break;
    case "admin":   renderAdminView(); break;
  }
}

// ─── Update switchView to set active class ───
function switchView(v) {
  activeView = v;
  document.querySelectorAll(".view").forEach(el => el.classList.toggle("active", el.id === v + "View"));
  document.querySelectorAll(".nav-btn").forEach(btn => btn.classList.toggle("active", btn.dataset.view === v));
  renderActiveView();
}

// ─── In loadState, set activeView to "home" ───
// (after applying state, before renderAll)
// At the bottom of loadState, before renderAll():
activeView = "home";
renderAll();

// ─── Attach home click listener ───
document.addEventListener("DOMContentLoaded", async () => {
  // ... existing DOMContentLoaded content ...
  // Add listener for home
  document.getElementById("homeView").addEventListener("click", handleHomeClick);
});

// ─── Also in the nav click handler, switch to home ───
// (The existing nav click handler uses switchView, so it will work)

// ──────────────────────────────────────────────────────────────────────────────
//  END OF ADDITIONS – everything else remains unchanged.
// ──────────────────────────────────────────────────────────────────────────────
</script>
</body>
</html>
