function renderSettingsView() {
  const container = document.getElementById("settingsView");
  const bills  = appSettings.recurringBills || [];
  const subs   = appSettings.recurringSubscriptions || [];
  const invsts = appSettings.recurringInvestments || [];
  const disc   = appSettings.discretionaryCategories || [];

  container.innerHTML = `
    <!-- Storage -->
    <div class="card">
      <div class="card-title">Data</div>
      <div class="settings-row">
        <span class="settings-label">Storage</span>
        <span class="storage-badge ${opfsAvailable || IS_STANDALONE ? "sb-ok" : "sb-warn"}">
          ${opfsAvailable ? "OPFS ✓" : IS_STANDALONE ? "App ✓" : "Safari"}
        </span>
      </div>
      <div class="settings-row">
        <span class="settings-label">Last backup</span>
        <span class="settings-value ${lastExportedAt ? "text-green" : "text-amber"}">
          ${lastExportedAt ? timeAgo(lastExportedAt) : "None this session"}
        </span>
      </div>
      <div style="margin:12px 0;">
        <label class="form-label">Backup filename</label>
        <div style="display:flex;align-items:center;gap:6px;">
          <input class="form-input" id="backupFileNameInput" type="text" value="${customBackupName}" placeholder="finance-backup" style="flex:1;">
          <span class="text-muted">.json</span>
        </div>
      </div>
      <button class="btn" id="exportBtn" style="margin-bottom:10px;">Export Backup</button>
      <button class="btn btn-ghost" id="importBtn">Restore from Backup</button>
      ${!IS_STANDALONE ? `
        <p class="text-muted" style="margin-top:12px;font-size:12px;line-height:1.5;">
          For best protection: Share → Add to Home Screen. This removes the 7-day Safari data timer.
        </p>
      ` : ""}
    </div>

    <!-- Categories -->
    <div class="card">
      <div class="card-title">Budget categories</div>
      ${renderAdminSection("bills", "Must Pay Bills", bills)}
      ${renderAdminSection("subs", "Subscriptions", subs)}
      ${renderAdminSection("invsts", "Savings", invsts)}
      ${renderAdminSection("disc", "Spending categories", disc, true)}
    </div>
  `;

  document.getElementById("exportBtn")?.addEventListener("click", () => {
    const nameInput = document.getElementById("backupFileNameInput");
    if (nameInput) { const v = nameInput.value.trim(); if (v) customBackupName = v; }
    handleBackupButtonClick();
  });
  document.getElementById("importBtn")?.addEventListener("click", () => {
    document.getElementById("importFileInput").click();
  });

  // Section toggles & item actions
  container.querySelectorAll("[data-toggle-section]").forEach(el => {
    el.addEventListener("click", () => {
      const s = el.dataset.toggleSection;
      if (collapsedAdminSections.has(s)) collapsedAdminSections.delete(s);
      else collapsedAdminSections.add(s);
      renderSettingsView();
    });
  });
  container.querySelectorAll("[data-edit-item]").forEach(btn => {
    btn.addEventListener("click", () => {
      editingBudgetItem = { section: btn.dataset.section, id: btn.dataset.editItem };
      renderSettingsView();
    });
  });
  container.querySelectorAll("[data-cancel-edit-item]").forEach(btn => {
    btn.addEventListener("click", () => { editingBudgetItem = null; renderSettingsView(); });
  });
  container.querySelectorAll("[data-save-item]").forEach(btn => {
    btn.addEventListener("click", () => {
      const section = btn.dataset.section;
      const id = btn.dataset.saveItem;
      const block = container.querySelector(`[data-edit-block="${id}"]`);
      if (!block) return;
      const name = block.querySelector(".edit-name")?.value?.trim();
      const budget = Number(block.querySelector(".edit-budget")?.value || 0);
      if (!name) { alert("Enter a name."); return; }
      const item = getSectionArray(section).find(i => i.id === id);
      if (item) {
        item.name = name;
        item.budgetAmount = budget;

        const due = block.querySelector(".edit-dueday");
        if (due) {
          const d = Number(due.value);
          item.dueDay = (d >= 1 && d <= 31) ? d : null;
        }

        // Split
        const splitCheck = block.querySelector(".edit-split-check");
        if (splitCheck) {
          item.splitEnabled = splitCheck.checked;
          item.splitFullAmount = Number(block.querySelector(".edit-split-full")?.value || 0);
        } else {
          item.splitEnabled = false;
          item.splitFullAmount = 0;
        }

        // Annual
        const annualCheck = block.querySelector(".edit-annual-check");
        if (annualCheck) {
          item.annualEnabled = annualCheck.checked;
          const at = Number(block.querySelector(".edit-annual-total")?.value || 0);
          item.annualTotal = at || budget * 12;
        } else {
          item.annualEnabled = false;
          item.annualTotal = 0;
        }
      }
      editingBudgetItem = null;
      saveState();
      renderSettingsView();
    });
  });

  // Live toggle + partner/annual calculations while editing
  container.querySelectorAll(".edit-split-check").forEach(cb => {
    cb.addEventListener("change", () => {
      const id = cb.dataset.for;
      const fields = document.getElementById("splitFields_" + id);
      if (fields) fields.style.display = cb.checked ? "block" : "none";
      const label = document.getElementById("budgetLabel_" + id);
      if (label) label.textContent = cb.checked ? "Your share / mo" : "Budget / mo";
    });
  });
  container.querySelectorAll(".edit-annual-check").forEach(cb => {
    cb.addEventListener("change", () => {
      const id = cb.dataset.for;
      const fields = document.getElementById("annualFields_" + id);
      if (fields) fields.style.display = cb.checked ? "block" : "none";
    });
  });
  container.querySelectorAll("[data-edit-block]").forEach(block => {
    const budgetInput = block.querySelector(".edit-budget");
    const fullInput = block.querySelector(".edit-split-full");
    const partnerEl = block.querySelector(".edit-partner-display");
    const annualTotalInput = block.querySelector(".edit-annual-total");
    const annualMonthlyEl = block.querySelector(".edit-annual-monthly");

    const updatePartner = () => {
      if (!partnerEl) return;
      const full = Number(fullInput?.value || 0);
      const your = Number(budgetInput?.value || 0);
      partnerEl.textContent = full > 0 ? fmt(Math.max(0, full - your)) : "—";
    };
    const updateAnnualMonthly = () => {
      if (!annualMonthlyEl) return;
      annualMonthlyEl.textContent = fmt(Number(budgetInput?.value || 0)) + "/mo";
    };

    budgetInput?.addEventListener("input", () => { updatePartner(); updateAnnualMonthly(); });
    fullInput?.addEventListener("input", updatePartner);

    // Optional: when annual total changes, suggest budget = total/12 if budget is empty/0
    annualTotalInput?.addEventListener("change", () => {
      const at = Number(annualTotalInput.value || 0);
      if (at > 0 && budgetInput && !Number(budgetInput.value)) {
        budgetInput.value = (at / 12).toFixed(2);
        updateAnnualMonthly();
      }
    });
  });
  container.querySelectorAll("[data-delete-item]").forEach(btn => {
    btn.addEventListener("click", () => {
      if (!confirm("Delete this item?")) return;
      const section = btn.dataset.section;
      const id = btn.dataset.deleteItem;
      const arr = getSectionArray(section);
      const idx = arr.findIndex(i => i.id === id);
      if (idx !== -1) arr.splice(idx, 1);
      saveState();
      renderSettingsView();
    });
  });
  container.querySelectorAll("[data-add-item]").forEach(btn => {
    btn.addEventListener("click", () => {
      const section = btn.dataset.addItem;
      const row = container.querySelector(`[data-add-row="${section}"]`);
      if (!row) return;
      const name = row.querySelector(".add-name")?.value?.trim();
      const budget = Number(row.querySelector(".add-budget")?.value || 0);
      if (!name) { alert("Enter a name."); return; }
      getSectionArray(section).push({ id: uid(), name, budgetAmount: budget });
      saveState();
      renderSettingsView();
    });
  });
}

function renderAdminSection(section, title, items, isDisc = false) {
  const collapsed = collapsedAdminSections.has(section);
  const total = items.reduce((s, i) => s + Number(i.budgetAmount || 0), 0);
  return `
    <div style="margin-bottom:8px;">
      <div class="admin-section-toggle" data-toggle-section="${section}">
        <div class="admin-section-left">
          <span style="font-size:14px;font-weight:600;">${title}</span>
          <span class="admin-section-meta">${items.length} · ${fmt(total)}/mo</span>
        </div>
        <span style="color:var(--text-3);font-size:12px;">${collapsed ? "›" : "▾"}</span>
      </div>
      ${collapsed ? "" : `
        <div style="padding:8px 0 4px;">
          ${items.map(item => {
            const editing = editingBudgetItem?.section === section && editingBudgetItem?.id === item.id;
            if (editing) {
              const splitOn = !!item.splitEnabled;
              const annualOn = !!item.annualEnabled;
              const splitFull = Number(item.splitFullAmount || 0);
              const annualTotal = Number(item.annualTotal || 0) || (Number(item.budgetAmount || 0) * 12);
              const partnerShare = splitFull > 0 ? Math.max(0, splitFull - Number(item.budgetAmount || 0)) : 0;
              return `
                <div data-edit-block="${item.id}" style="padding:12px 0;border-bottom:1px solid var(--border);">
                  <div class="input-grid-2">
                    <div class="full">
                      <label class="form-label">Name</label>
                      <input class="form-input edit-name" type="text" value="${item.name}">
                    </div>
                    <div>
                      <label class="form-label" id="budgetLabel_${item.id}">${splitOn ? "Your share / mo" : "Budget / mo"}</label>
                      <input class="form-input edit-budget" type="number" step="0.01" value="${item.budgetAmount || ""}">
                    </div>
                    ${!isDisc ? `
                    <div>
                      <label class="form-label">Due day (1–31)</label>
                      <input class="form-input edit-dueday" type="number" min="1" max="31" value="${item.dueDay || ""}" placeholder="Optional">
                    </div>` : `<div></div>`}
                  </div>

                  ${!isDisc ? `
                  <!-- Split with partner -->
                  <label class="admin-toggle" style="margin-top:12px;" id="splitToggle_${item.id}">
                    <input type="checkbox" class="edit-split-check" ${splitOn ? "checked" : ""} data-for="${item.id}">
                    <span>
                      <strong style="color:var(--text);">Split with partner</strong>
                      <span style="display:block;font-size:11px;color:var(--text-3);margin-top:1px;">You log the full bill · only your share counts against budget</span>
                    </span>
                  </label>
                  <div class="admin-sub" id="splitFields_${item.id}" style="display:${splitOn ? "block" : "none"};">
                    <div class="input-grid-2">
                      <div>
                        <label class="form-label">Full bill amount</label>
                        <input class="form-input edit-split-full" type="number" step="0.01" value="${splitFull || ""}" placeholder="e.g. 2000">
                      </div>
                      <div>
                        <label class="form-label">Partner covers</label>
                        <div class="edit-partner-display" style="font-size:15px;font-weight:700;color:var(--text-2);padding:10px 0 4px;">
                          ${splitFull > 0 ? fmt(partnerShare) : "—"}
                        </div>
                      </div>
                    </div>
                  </div>

                  <!-- Annual fee -->
                  <label class="admin-toggle" style="margin-top:8px;" id="annualToggle_${item.id}">
                    <input type="checkbox" class="edit-annual-check" ${annualOn ? "checked" : ""} data-for="${item.id}">
                    <span>
                      <strong style="color:var(--text);">Annual fee</strong>
                      <span style="display:block;font-size:11px;color:var(--text-3);margin-top:1px;">Budget monthly · marks paid when the yearly charge is logged</span>
                    </span>
                  </label>
                  <div class="admin-sub" id="annualFields_${item.id}" style="display:${annualOn ? "block" : "none"};">
                    <div class="input-grid-2">
                      <div>
                        <label class="form-label">Annual total</label>
                        <input class="form-input edit-annual-total" type="number" step="0.01" value="${annualTotal || ""}" placeholder="e.g. 1200">
                      </div>
                      <div>
                        <label class="form-label">Monthly set-aside</label>
                        <div class="edit-annual-monthly" style="font-size:15px;font-weight:700;color:var(--accent);padding:10px 0 4px;">
                          ${fmt(Number(item.budgetAmount || 0))}/mo
                        </div>
                      </div>
                    </div>
                    <p style="font-size:11px;color:var(--text-3);margin-top:6px;line-height:1.4;">Tip: set Budget / mo to annual ÷ 12. When you log the full yearly charge, it marks as paid.</p>
                  </div>
                  ` : ""}

                  <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px;">
                    <button class="btn btn-sm btn-ghost" data-cancel-edit-item>Cancel</button>
                    <button class="btn btn-sm" data-save-item="${item.id}" data-section="${section}">Save</button>
                  </div>
                </div>`;
            }

            // Display row with compact badges
            const badges = [];
            if (item.dueDay) badges.push(`<span class="item-badge">day ${item.dueDay}</span>`);
            if (item.splitEnabled && Number(item.splitFullAmount) > 0) {
              const partner = Math.max(0, Number(item.splitFullAmount) - Number(item.budgetAmount || 0));
              badges.push(`<span class="item-badge">split · partner ${fmt(partner)}</span>`);
            }
            if (item.annualEnabled) badges.push(`<span class="item-badge">annual</span>`);

            return `
              <div class="admin-item">
                <div class="admin-item-name" style="min-width:0;">
                  <div>${item.name}</div>
                  ${badges.length ? `<div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:3px;">${badges.join("")}</div>` : ""}
                </div>
                <div class="admin-item-budget">${item.budgetAmount ? fmt(item.budgetAmount) : "—"}</div>
                <div class="admin-item-btns">
                  <button class="icon-btn" data-edit-item="${item.id}" data-section="${section}">✏️</button>
                  <button class="icon-btn" data-delete-item="${item.id}" data-section="${section}">🗑</button>
                </div>
              </div>`;
          }).join("")}
          <div data-add-row="${section}" style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;">
            <input class="form-input add-name" type="text" placeholder="Name" style="flex:1;min-width:100px;">
            <input class="form-input add-budget" type="number" placeholder="$ / mo" style="width:90px;">
            <button class="btn btn-sm" data-add-item="${section}">Add</button>
          </div>
          ${!isDisc ? `<p style="font-size:11px;color:var(--text-3);margin-top:6px;">After adding, tap ✏️ to set due day, split, or annual options.</p>` : ""}
        </div>`}
    </div>`;
}

// ═══════════════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════════════

document.addEventListener("DOMContentLoaded", async () => {
  document.querySelectorAll(".nav-btn").forEach(btn =>
    btn.addEventListener("click", () => switchView(btn.dataset.view))
  );

  const imp = document.getElementById("importFileInput");
  imp.addEventListener("change", e => {
    const f = e.target.files?.[0];
    if (f) importStateFromFile(f);
    imp.value = "";
  });

  await loadState();
});
</script>
</body>
</html>
