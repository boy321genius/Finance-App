<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <title>Finance</title>
  <meta name="theme-color" content="#0a0f1a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Finance" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="description" content="Simple local-first personal finance" />

  <link rel="manifest" href='data:application/manifest+json,{
    "name":"Finance","short_name":"Finance","description":"Local-first personal finance",
    "start_url":"./","display":"standalone","background_color":"#0a0f1a","theme_color":"#0a0f1a","orientation":"portrait",
    "icons":[{"src":"data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 180 180%22%3E%3Crect width=%22180%22 height=%22180%22 rx=%2240%22 fill=%22%230a0f1a%22/%3E%3Ctext x=%2290%22 y=%22125%22 font-size=%22100%22 text-anchor=%22middle%22 fill=%22%23ffffff%22%3E$%3C/text%3E%3C/svg%3E","sizes":"180x180","type":"image/svg+xml"}]
  }' />

  <style>
    :root {
      --bg:          #0a0f1a;
      --bg-card:     #111827;
      --bg-elevated: #1a2332;
      --border:      rgba(255,255,255,0.07);
      --text:        #f1f5f9;
      --text-2:      #94a3b8;
      --text-3:      #64748b;
      --accent:      #60a5fa;
      --accent-dim:  rgba(96,165,250,0.12);
      --green:       #34d399;
      --green-dim:   rgba(52,211,153,0.12);
      --amber:       #fbbf24;
      --amber-dim:   rgba(251,191,36,0.12);
      --red:         #f87171;
      --red-dim:     rgba(248,113,113,0.12);
      --radius:      16px;
      --radius-sm:   10px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: calc(72px + env(safe-area-inset-bottom, 0px));
      -webkit-font-smoothing: antialiased;
    }

    /* ── Header ── */
    .app-header {
      position: sticky; top: 0; z-index: 20;
      background: rgba(10,15,26,0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      padding: calc(env(safe-area-inset-top, 0px) + 14px) 20px 14px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .header-left h1 {
      font-size: 18px; font-weight: 700; letter-spacing: -0.3px;
    }
    .header-left p {
      font-size: 12px; color: var(--text-2); margin-top: 2px;
    }
    .status-pill {
      display: flex; align-items: center; gap: 6px;
      padding: 6px 12px; border-radius: 20px;
      font-size: 11px; font-weight: 600;
      border: 1px solid transparent;
      background: none; color: var(--text-2); cursor: default;
    }
    .status-pill.warn { background: var(--amber-dim); border-color: rgba(251,191,36,0.25); color: var(--amber); cursor: pointer; }
    .status-pill.ok   { background: var(--green-dim); border-color: rgba(52,211,153,0.25); color: var(--green); }
    .status-pill.saving { color: var(--text-3); }

    /* ── Banners ── */
    #bannerContainer { position: sticky; top: 0; z-index: 19; }
    .banner {
      display: flex; align-items: flex-start; gap: 12px;
      padding: 12px 20px; font-size: 13px; line-height: 1.4;
      border-bottom: 1px solid var(--border);
      animation: slideDown 0.25s ease;
    }
    @keyframes slideDown { from { opacity:0; transform:translateY(-6px); } to { opacity:1; transform:translateY(0); } }
    .banner-warn { background: rgba(30,22,8,0.95); }
    .banner-info { background: rgba(15,25,45,0.95); }
    .banner-icon { font-size: 18px; flex-shrink: 0; }
    .banner-body { flex: 1; min-width: 0; }
    .banner-title { font-weight: 600; color: var(--text); }
    .banner-sub { font-size: 12px; color: var(--text-2); margin-top: 2px; }
    .banner-actions { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
    .banner-btn {
      padding: 5px 12px; border-radius: 8px; font-size: 12px; font-weight: 600;
      border: 1px solid; cursor: pointer; font-family: inherit;
    }
    .bb-blue { background: var(--accent-dim); border-color: rgba(96,165,250,0.3); color: var(--accent); }
    .bb-green { background: var(--green-dim); border-color: rgba(52,211,153,0.3); color: var(--green); }
    .banner-x {
      background: none; border: none; color: var(--text-3); font-size: 18px;
      cursor: pointer; padding: 0 2px; line-height: 1;
    }

    /* ── Layout ── */
    .content { max-width: 480px; margin: 0 auto; padding: 20px 16px 24px; }
    .view { display: none; }
    .view.active { display: block; }

    /* ── Cards ── */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      margin-bottom: 14px;
    }
    .card-title {
      font-size: 13px; font-weight: 600; color: var(--text-2);
      text-transform: uppercase; letter-spacing: 0.4px;
      margin-bottom: 14px;
    }
    .card-header-row {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 14px;
    }
    .card-header-row .card-title { margin-bottom: 0; }

    /* ── Big number ── */
    .hero-number {
      font-size: 36px; font-weight: 700; letter-spacing: -1px;
      line-height: 1.1;
    }
    .hero-label {
      font-size: 13px; color: var(--text-2); margin-top: 4px;
    }

    /* ── Stats row ── */
    .stat-row {
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
    }
    .stat-box {
      background: var(--bg-elevated);
      border-radius: var(--radius-sm);
      padding: 14px;
    }
    .stat-box-label {
      font-size: 11px; color: var(--text-3); font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.3px; margin-bottom: 6px;
    }
    .stat-box-value {
      font-size: 20px; font-weight: 700; letter-spacing: -0.4px;
    }

    /* ── Progress ── */
    .progress-track {
      height: 6px; background: rgba(255,255,255,0.06);
      border-radius: 99px; overflow: hidden; margin-top: 8px;
    }
    .progress-fill {
      height: 100%; border-radius: 99px; transition: width 0.3s ease;
    }
    .progress-fill.under { background: var(--green); }
    .progress-fill.warn  { background: var(--amber); }
    .progress-fill.over  { background: var(--red); }
    .progress-fill.unset { background: var(--accent); }

    /* ── Month nav ── */
    .month-nav {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 18px;
    }
    .month-nav-btn {
      width: 36px; height: 36px; border-radius: 10px;
      background: var(--bg-elevated); border: 1px solid var(--border);
      color: var(--text); font-size: 16px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-family: inherit;
    }
    .month-nav-btn:active { background: var(--bg-card); }
    .month-nav-label {
      font-size: 16px; font-weight: 600; text-align: center;
    }
    .month-nav-sub {
      font-size: 11px; color: var(--text-3); text-align: center; margin-top: 2px;
    }

    /* ── Unpaid bills (quick log) ── */
    .unpaid-list { display: flex; flex-direction: column; gap: 8px; }
    .unpaid-row {
      display: flex; align-items: center; gap: 12px;
      background: var(--bg-elevated);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
    }
    .unpaid-info { flex: 1; min-width: 0; }
    .unpaid-name {
      font-size: 14px; font-weight: 600;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .unpaid-meta {
      font-size: 12px; color: var(--text-3); margin-top: 2px;
    }
    .unpaid-btn {
      flex-shrink: 0;
      background: var(--accent); color: #0a0f1a;
      border: none; border-radius: 8px;
      padding: 8px 14px; font-size: 13px; font-weight: 700;
      cursor: pointer; font-family: inherit;
      white-space: nowrap;
    }
    .unpaid-btn:active { opacity: 0.85; }
    .unpaid-empty {
      text-align: center; padding: 20px 10px;
      color: var(--text-3); font-size: 13px;
    }

    /* ── Transaction rows ── */
    .tx-list { list-style: none; }
    .tx-row {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }
    .tx-row:last-child { border-bottom: none; }
    .tx-icon {
      width: 36px; height: 36px; border-radius: 10px;
      background: var(--bg-elevated);
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; flex-shrink: 0;
    }
    .tx-info { flex: 1; min-width: 0; }
    .tx-cat {
      font-size: 14px; font-weight: 600;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .tx-meta {
      font-size: 12px; color: var(--text-3); margin-top: 2px;
    }
    .tx-amount {
      font-size: 15px; font-weight: 700; flex-shrink: 0;
    }
    .tx-actions {
      display: flex; gap: 4px; flex-shrink: 0;
    }
    .tx-action {
      background: none; border: none; padding: 6px;
      font-size: 14px; cursor: pointer; border-radius: 6px;
      color: var(--text-3);
    }
    .tx-action:active { background: var(--bg-elevated); }

    /* ── Add form ── */
    .add-form {
      display: flex; flex-direction: column; gap: 12px;
    }
    .form-label {
      font-size: 12px; font-weight: 600; color: var(--text-2);
      margin-bottom: 6px; display: block;
    }
    .form-input, .form-select {
      width: 100%;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      font-size: 15px; color: var(--text);
      font-family: inherit;
      -webkit-appearance: none; appearance: none;
    }
    .form-input:focus, .form-select:focus {
      outline: none; border-color: var(--accent);
    }
    .form-input::placeholder { color: var(--text-3); }
    .form-select option { background: var(--bg-card); color: var(--text); }
    .form-select optgroup { color: var(--text-2); font-size: 11px; }

    .amount-input {
      font-size: 28px; font-weight: 700; letter-spacing: -0.5px;
      text-align: center; padding: 16px;
    }

    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      gap: 6px;
      background: var(--accent); color: #0a0f1a;
      border: none; border-radius: 12px;
      padding: 14px 20px; font-size: 15px; font-weight: 700;
      cursor: pointer; font-family: inherit;
      width: 100%;
    }
    .btn:active { opacity: 0.9; }
    .btn-ghost {
      background: transparent; color: var(--accent);
      border: 1px solid rgba(96,165,250,0.25);
    }
    .btn-sm {
      padding: 8px 14px; font-size: 13px; border-radius: 8px; width: auto;
    }
    .btn-danger {
      background: var(--red-dim); color: var(--red);
      border: 1px solid rgba(248,113,113,0.25);
    }

    /* ── Budget rows ── */
    .budget-section { margin-bottom: 22px; }
    .budget-section:last-child { margin-bottom: 0; }
    .budget-section-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 12px; padding: 10px 12px;
      background: var(--bg-elevated);
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
    }
    .budget-section-title {
      font-size: 14px; font-weight: 700; color: var(--text);
      letter-spacing: 0.2px;
    }
    .budget-section-total {
      font-size: 13px; font-weight: 700; color: var(--text-2);
    }

    .mode-toggle {
      display: flex; gap: 4px;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 10px; padding: 3px;
      margin-bottom: 14px;
    }
    .mode-btn {
      flex: 1; text-align: center;
      padding: 8px 12px; border-radius: 8px;
      font-size: 13px; font-weight: 600;
      border: none; cursor: pointer; font-family: inherit;
      background: none; color: var(--text-3);
    }
    .mode-btn.active {
      background: var(--accent-dim);
      color: var(--accent);
    }
    .budget-item {
      padding: 10px 0;
    }
    .budget-item-row {
      display: flex; justify-content: space-between; align-items: baseline;
      gap: 8px; margin-bottom: 6px;
    }
    .budget-item-name {
      font-size: 14px; font-weight: 500;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      flex: 1; min-width: 0;
    }
    .budget-item-amounts {
      font-size: 13px; flex-shrink: 0;
    }
    .budget-actual { font-weight: 700; }
    .budget-limit { color: var(--text-3); }

    /* ── Goals overview ── */
    .goal-row {
      display: flex; align-items: center; gap: 14px;
      padding: 14px 0;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
    }
    .goal-row:last-child { border-bottom: none; }
    .goal-row:active { opacity: 0.8; }
    .goal-icon {
      width: 40px; height: 40px; border-radius: 12px;
      background: var(--bg-elevated);
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; flex-shrink: 0;
    }
    .goal-info { flex: 1; min-width: 0; }
    .goal-name { font-size: 15px; font-weight: 600; }
    .goal-sub { font-size: 12px; color: var(--text-3); margin-top: 2px; }
    .goal-right { text-align: right; flex-shrink: 0; }
    .goal-pct { font-size: 15px; font-weight: 700; }
    .goal-arrow { font-size: 12px; color: var(--text-3); margin-top: 2px; }

    /* ── Goal detail ── */
    .back-link {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 14px; font-weight: 600; color: var(--accent);
      background: none; border: none; cursor: pointer;
      font-family: inherit; margin-bottom: 16px; padding: 0;
    }

    /* ── Settings ── */
    .settings-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 0;
      border-bottom: 1px solid var(--border);
    }
    .settings-row:last-child { border-bottom: none; }
    .settings-label { font-size: 14px; font-weight: 500; }
    .settings-value { font-size: 13px; color: var(--text-2); }

    .storage-badge {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 4px 10px; border-radius: 8px;
      font-size: 11px; font-weight: 600;
      border: 1px solid;
    }
    .sb-ok { background: var(--green-dim); border-color: rgba(52,211,153,0.25); color: var(--green); }
    .sb-warn { background: var(--amber-dim); border-color: rgba(251,191,36,0.25); color: var(--amber); }

    /* ── Admin edit ── */
    .admin-item {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }
    .admin-item:last-child { border-bottom: none; }
    .admin-item-name { flex: 1; font-size: 14px; min-width: 0; }
    .admin-item-budget { font-size: 13px; font-weight: 700; color: var(--accent); min-width: 60px; text-align: right; }
    .admin-item-btns { display: flex; gap: 4px; flex-shrink: 0; }
    .icon-btn {
      background: var(--bg-elevated); border: 1px solid var(--border);
      border-radius: 8px; padding: 6px 8px; font-size: 13px;
      cursor: pointer; color: var(--text-2);
    }
    .icon-btn:active { background: var(--bg-card); }

    .item-badge {
      display: inline-block;
      font-size: 10px; font-weight: 600;
      padding: 2px 7px; border-radius: 6px;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      color: var(--text-3);
      white-space: nowrap;
    }

    .admin-toggle {
      display: flex; align-items: flex-start; gap: 10px;
      padding: 10px 12px; border-radius: 10px;
      background: var(--bg-elevated); border: 1px solid var(--border);
      cursor: pointer; user-select: none;
    }
    .admin-toggle input[type=checkbox] {
      accent-color: var(--accent); width: 16px; height: 16px;
      margin-top: 2px; flex-shrink: 0; cursor: pointer;
    }
    .admin-toggle strong { font-size: 13px; font-weight: 600; }
    .admin-sub {
      padding: 10px 4px 4px;
    }

    .admin-section-toggle {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 0; cursor: pointer;
      border-bottom: 1px solid var(--border);
      user-select: none;
    }
    .admin-section-toggle:active { opacity: 0.8; }
    .admin-section-left { display: flex; align-items: center; gap: 8px; }
    .admin-section-meta {
      font-size: 11px; color: var(--text-3);
      background: var(--bg-elevated); padding: 2px 8px; border-radius: 99px;
    }

    /* ── Empty state ── */
    .empty {
      text-align: center; padding: 32px 16px;
      color: var(--text-3); font-size: 14px;
    }

    /* ── First run ── */
    .fr-overlay {
      position: fixed; inset: 0; z-index: 100;
      background: rgba(10,15,26,0.96);
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
    }
    .fr-card {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 20px; padding: 28px 22px; max-width: 340px; width: 100%;
      text-align: center;
    }
    .fr-emoji { font-size: 48px; margin-bottom: 12px; }
    .fr-title { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
    .fr-sub { font-size: 14px; color: var(--text-2); line-height: 1.5; margin-bottom: 24px; }
    .fr-btns { display: flex; flex-direction: column; gap: 10px; }
    .fr-hint { font-size: 11px; color: var(--text-3); margin-top: 4px; }

    /* ── Bottom nav ── */
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 30;
      background: rgba(17,24,39,0.95);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid var(--border);
      display: flex; justify-content: space-around;
      padding: 6px 0 calc(6px + env(safe-area-inset-bottom, 0px));
    }
    .nav-btn {
      flex: 1; background: none; border: none;
      color: var(--text-3); padding: 6px 4px 4px;
      cursor: pointer; display: flex; flex-direction: column;
      align-items: center; gap: 3px;
      font-size: 10px; font-weight: 500; font-family: inherit;
    }
    .nav-btn.active { color: var(--accent); }
    .nav-icon {
      width: 28px; height: 28px; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
    }
    .nav-btn.active .nav-icon {
      background: var(--accent-dim);
    }

    /* ── Misc ── */
    .text-muted { color: var(--text-2); font-size: 13px; }
    .text-green { color: var(--green); }
    .text-amber { color: var(--amber); }
    .text-red { color: var(--red); }
    .text-accent { color: var(--accent); }

    .link-btn {
      background: none; border: none; color: var(--accent);
      font-size: 13px; font-weight: 600; cursor: pointer;
      font-family: inherit; padding: 0;
    }

    .chip-row {
      display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px;
    }
    .chip {
      padding: 6px 12px; border-radius: 20px;
      font-size: 12px; font-weight: 600;
      background: var(--bg-elevated); border: 1px solid var(--border);
      color: var(--text-2); cursor: pointer; font-family: inherit;
    }
    .chip.active {
      background: var(--accent-dim); border-color: rgba(96,165,250,0.3);
      color: var(--accent);
    }

    .divider {
      height: 1px; background: var(--border); margin: 16px 0;
    }

    /* Goal detail specific (kept functional but cleaner) */
    .goal-stat-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
      margin-bottom: 16px;
    }
    .goal-stat {
      background: var(--bg-elevated); border-radius: var(--radius-sm);
      padding: 12px;
    }
    .goal-stat-label {
      font-size: 10px; font-weight: 600; color: var(--text-3);
      text-transform: uppercase; letter-spacing: 0.3px; margin-bottom: 4px;
    }
    .goal-stat-value {
      font-size: 18px; font-weight: 700;
    }

    .ret-table {
      width: 100%; border-collapse: collapse; font-size: 12px;
    }
    .ret-table th {
      font-size: 10px; font-weight: 700; text-transform: uppercase;
      color: var(--text-3); padding: 0 4px 8px; text-align: right;
    }
    .ret-table th:first-child { text-align: left; }
    .ret-table td {
      padding: 7px 4px; border-bottom: 1px solid var(--border);
      text-align: right;
    }
    .ret-table td:first-child { text-align: left; color: var(--text-2); }
    .ret-row-retire td { background: var(--accent-dim); font-weight: 700; }

    .input-grid-2 {
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
      margin-bottom: 12px;
    }
    .input-grid-2 .full { grid-column: 1 / -1; }

    /* Hide scrollbar on horizontal tabs if any */
    .hide-scroll::-webkit-scrollbar { display: none; }
    .hide-scroll { scrollbar-width: none; }
  </style>
</head>

function uid() {
  return crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random());
}
function formatMonthKey(date) {
  return date.getFullYear() + "-" + String(date.getMonth() + 1).padStart(2, "0");
}
function formatMonthLabelFromKey(key) {
  const [y, m] = key.split("-");
  return new Date(+y, +m - 1, 1).toLocaleString(undefined, { month: "long", year: "numeric" });
}
function fmt(n) { return "$" + Number(n || 0).toFixed(2); }
function fmtShort(n) {
  const v = Number(n || 0);
  if (Math.abs(v) >= 1000) return "$" + (v / 1000).toFixed(1) + "k";
  return "$" + v.toFixed(0);
}

function timeAgo(date) {
  if (!date) return null;
  const mins = Math.floor((Date.now() - date.getTime()) / 60000);
  if (mins < 1)  return "just now";
  if (mins < 60) return `${mins}m ago`;
  const hrs = Math.floor(mins / 60);
  if (hrs < 24)  return `${hrs}h ago`;
  const days = Math.floor(hrs / 24);
  return `${days}d ago`;
}

function daysSince(date) {
  if (!date) return Infinity;
  return (Date.now() - date.getTime()) / 86400000;
}

function progressClass(actual, budget) {
  if (!budget) return "unset";
  const diff = actual - budget;
  const p    = actual / budget;
  if (diff >= 2) return "over";
  if (Math.abs(diff) <= 2) return "unset";
  if (p >= 0.8) return "warn";
  return "under";
}
function progressColor(cls) {
  return cls === "over" ? "var(--red)"
    : cls === "warn" ? "var(--amber)"
    : cls === "under" ? "var(--green)"
    : "var(--accent)";
}

function ensureMonthExists(key) {
  if (!months[key]) months[key] = { meta: { label: key, incomeSources: [] }, transactions: [] };
  if (!Array.isArray(months[key].meta.incomeSources)) months[key].meta.incomeSources = [];
}

function computeActuals(transactions) {
  const t = {};
  (transactions || []).forEach(tx => {
    if (!tx.category) return;
    t[tx.category] = (t[tx.category] || 0) + Number(tx.amount || 0);
  });
  return t;
}

function getEffectiveActual(item, rawActual) {
  if (!item || typeof item === "string") return rawActual;
  if (!item.splitEnabled || !Number(item.splitFullAmount)) return rawActual;
  const yourShare  = Number(item.budgetAmount || 0);
  const fullAmount = Number(item.splitFullAmount);
  if (!fullAmount || !yourShare) return rawActual;
  return rawActual * (yourShare / fullAmount);
}

function isAnnualPaid(item, yearTxs) {
  if (!item || !item.annualEnabled) return false;
  const annualTotal = Number(item.annualTotal) || Number(item.budgetAmount || 0) * 12;
  if (!annualTotal) return false;
  const yearTotal = (yearTxs || [])
    .filter(t => t.category === item.name)
    .reduce((s, t) => s + Number(t.amount || 0), 0);
  return yearTotal >= annualTotal * 0.75;
}

function computeEffectiveActuals(rawActuals, allItems) {
  const result = Object.assign({}, rawActuals);
  (allItems || []).forEach(item => {
    if (item.splitEnabled && Number(item.splitFullAmount) > 0) {
      result[item.name] = getEffectiveActual(item, rawActuals[item.name] || 0);
    }
  });
  return result;
}

function buildCategoryOptions(selectedValue) {

}

function getMonthIncome(key) {

function getMonthSpent(key) {
  ensureMonthExists(key);

}

function getUnpaidRecurring(monthKey) {
  ensureMonthExists(monthKey);
  const txs = months[monthKey].transactions || [];
  const paidCats = new Set(txs.map(t => t.category));
  const items = [
    ...(appSettings.recurringBills || []),
    ...(appSettings.recurringSubscriptions || [])
  ].filter(item => {
    // Only items with a due date get the easy one-tap log
    if (!item.dueDay || item.dueDay < 1 || item.dueDay > 31) return false;
    if (!item.budgetAmount || item.budgetAmount <= 0) return false;
    if (item.annualEnabled && isAnnualPaid(item, getYearTxs(monthKey))) return false;
    return !paidCats.has(item.name);
  });
  // Sort by due day ascending (1 → 31)
  items.sort((a, b) => (a.dueDay || 99) - (b.dueDay || 99));
  return items;
}

function getYearTxs(monthKey) {
  const year = monthKey.split("-")[0];
  return Object.entries(months)
    .filter(([k]) => k.startsWith(year))
    .flatMap(([, m]) => m.transactions || []);
}

    ...(appSettings.recurringBills || []),
    ...(appSettings.recurringSubscriptions || []),
    ...(appSettings.recurringInvestments || []),
    ...(appSettings.discretionaryCategories || [])

}

const OPFS_FILENAME = "finance-tracker-state.json";

async function opfsWrite(data) {
  if (!HAS_OPFS) return false;
  try {
    const root    = await navigator.storage.getDirectory();
    const fh      = await root.getFileHandle(OPFS_FILENAME, { create: true });
    const writable = await fh.createWritable();
    await writable.write(data);
    await writable.close();
    return true;
  } catch(e) {
    console.warn("OPFS write failed:", e);
    return false;
  }
}

async function opfsRead() {
  if (!HAS_OPFS) return null;
  try {
    const root = await navigator.storage.getDirectory();
    const fh   = await root.getFileHandle(OPFS_FILENAME);
    const file = await fh.getFile();
    return await file.text();
  } catch(e) {
    return null;
  }
}

function openIDB() {
  if (_idb) return Promise.resolve(_idb);
  return new Promise((res, rej) => {
    const req = indexedDB.open(IDB_NAME, IDB_VERSION);
    req.onupgradeneeded = e => {
      const db = e.target.result;
      [IDB_STATE, IDB_PREFS].forEach(s => {
        if (!db.objectStoreNames.contains(s)) db.createObjectStore(s);
      });
    };
    req.onsuccess = e => { _idb = e.target.result; res(_idb); };
    req.onerror   = e => rej(e.target.error);
  });
}
async function idbGet(store, key) {
  const db = await openIDB();
  return new Promise((res, rej) => {
    const r = db.transaction(store, "readonly").objectStore(store).get(key);
    r.onsuccess = e => res(e.target.result); r.onerror = e => rej(e.target.error);
  });
}
async function idbSet(store, key, val) {
  const db = await openIDB();
  return new Promise((res, rej) => {
    const r = db.transaction(store, "readwrite").objectStore(store).put(val, key);
    r.onsuccess = () => res(); r.onerror = e => rej(e.target.error);
  });
}

async function requestPersistence() {
  if (!navigator.storage?.persist) return false;
  try {
    const granted = await navigator.storage.persist();
    console.log("Storage persistence granted:", granted);
    return granted;
  } catch(e) {
    console.warn("Storage persist request failed:", e);
    return false;
  }
}

async function checkPersistence() {
  if (!navigator.storage?.persisted) return false;
  try { return await navigator.storage.persisted(); } catch(e) { return false; }
}

async function maybeShowBackupNudge() {
  if (daysSince(lastExportedAt) < BACKUP_NUDGE_DAYS) return;
  if (document.getElementById("backup-nudge-banner")) return;
  const totalTxCount = Object.values(months).reduce((s, m) => s + (m.transactions?.length || 0), 0);
  if (totalTxCount === 0) return;
  try {
    const dismissed = await idbGet(IDB_PREFS, "nudgeDismissedDate");
    if (dismissed) {
      const dismissedDate = new Date(dismissed).toDateString();
      if (dismissedDate === new Date().toDateString()) return;
    }
  } catch(e) {}

  const dayCount = lastExportedAt ? Math.floor(daysSince(lastExportedAt)) : null;
  const msg = dayCount !== null
    ? `Last backup was ${dayCount} day${dayCount !== 1 ? "s" : ""} ago.`
    : "You haven't backed up yet.";

  const el = document.createElement("div");
  el.id = "backup-nudge-banner";
  el.className = "banner banner-warn";
  el.innerHTML = `
    <span class="banner-icon">💾</span>
    <div class="banner-body">
      <div class="banner-title">${msg}</div>
      <div class="banner-sub">Export a backup to keep your data safe.</div>

        <button class="banner-btn bb-green" id="nudgeBackupBtn">Back Up Now</button>
      </div>
    </div>
    <button class="banner-x" id="nudgeDismissBtn">×</button>`;
  document.getElementById("bannerContainer")?.appendChild(el);

  document.getElementById("nudgeBackupBtn")?.addEventListener("click", () => {
    dismissBanner("backup-nudge-banner");
    handleBackupButtonClick();
  });
  document.getElementById("nudgeDismissBtn")?.addEventListener("click", async () => {
    dismissBanner("backup-nudge-banner");
    try { await idbSet(IDB_PREFS, "nudgeDismissedDate", new Date().toISOString()); } catch(e) {}
  });
}

function updateStatusChip() {
  const chip = document.getElementById("saveStatusChip");
  if (!chip) return;
  let icon, label, cls, clickable = false, title = "";

  if (fileStatus === "loading") {
    icon = "…"; label = "Loading"; cls = "saving";
  } else if (fileStatus === "ios-backed") {
    icon = "✓"; label = "Backed up"; cls = "ok";
    title = lastExportedAt ? "Last backed up: " + lastExportedAt.toLocaleTimeString() : "";
  } else if (opfsAvailable && IS_STANDALONE) {
    icon = "✓"; label = "Protected"; cls = "ok";
    title = "Stored in OPFS — most durable local storage.";
  } else if (opfsAvailable) {
    icon = "✓"; label = "OPFS"; cls = "ok";
    clickable = true;
    title = "OPFS active. Tap to export a backup.";
  } else if (IS_STANDALONE) {
    icon = "✓"; label = "Protected"; cls = "ok";
    title = "Installed app — protected from 7-day wipe.";
  } else {
    icon = "💾"; label = "Export"; cls = "warn";
    clickable = true;
    title = "Tap to export a backup to Files / iCloud.";
  }

  chip.className = "status-pill " + cls;
  chip.innerHTML = `<span id="chipIcon">${icon}</span><span id="chipLabel">${label}</span>`;
  chip.title = title;
  chip.onclick = clickable ? handleChipClick : null;

function migrateMisplacedTransactions() {
  let changed = false;
  Object.keys(months).forEach(monthKey => {
    if (!Array.isArray(months[monthKey].transactions)) { months[monthKey].transactions = []; return; }
    const misplaced = [];
    months[monthKey].transactions = months[monthKey].transactions.filter(tx => {
      if (!tx.dateISO) return true;
      const [y, m] = tx.dateISO.split("-");
      const correctKey = y + "-" + m;
      if (correctKey !== monthKey) { misplaced.push({ tx, correctKey }); changed = true; return false; }
      return true;
    });
    misplaced.forEach(({ tx, correctKey }) => { ensureMonthExists(correctKey); months[correctKey].transactions.push(tx); });
  });
  if (changed) saveState();
}

function applyStateObject(state) {
  if (!state) state = {};
  appSettings  = { ...appSettings, ...(state.appSettings  || {}) };
  months       = state.months       || {};
  plannerState = { ...plannerState, ...(state.plannerState || {}) };
  if (state.activeFileName) activeFileName = state.activeFileName;

  if (!appSettings.recurringBills?.length)          appSettings.recurringBills          = DEFAULT_BILLS.map(i => ({ ...i }));
  if (!appSettings.recurringSubscriptions?.length)  appSettings.recurringSubscriptions  = DEFAULT_SUBS.map(i => ({ ...i }));
  if (!appSettings.recurringInvestments?.length)    appSettings.recurringInvestments    = DEFAULT_INVESTMENTS.map(i => ({ ...i }));
  if (!appSettings.discretionaryCategories?.length) appSettings.discretionaryCategories = DEFAULT_DISC.map(i => ({ ...i }));

  Object.values(months).forEach(mo => {
    if (!mo.meta) mo.meta = {};
    if (!Array.isArray(mo.meta.incomeSources)) {
      const legacy = Number(mo.meta.income || 0);
      mo.meta.incomeSources = legacy > 0 ? [{ id: uid(), label: "Primary Income", amount: legacy }] : [];
    }
  });

  if (plannerState.goals) {
    plannerState.goals = plannerState.goals.map(g => {
      if (g.type === "generic" && g.name === "Retirement") {
        return {
          ...g, type: "retirement",

          retMonthlyContrib: Number(g.monthlyContribution || 500),
          retCurrentAge: g.retCurrentAge || 35,
          retRetirementAge: g.retRetirementAge || 65,
        };
      }
      return g;
    });
  }

  if (!plannerState.goals || plannerState.goals.length === 0) {
    plannerState.goals = [
      { id: uid(), type: "emergency", name: "Emergency Fund", icon: "🛡️", currentAmount: 0, baselineMonths: 3, goalMonths: 6 },
      { id: uid(), type: "retirement", name: "Retirement", icon: "🏖️", currentAmount: 0, monthlyContribution: 500, retCurrentSavings: 0, retMonthlyContrib: 500, retCurrentAge: 35, retRetirementAge: 65 },
      { id: uid(), type: "home", name: "Home Purchase", icon: "🏠",
        currentSavings: 0, monthlyNetIncome: 0,
        interestRate: 6.25, loanTermYears: 30, hoaFee: 300,
        propTaxRate: 1.7, hoiRate: 0.5, pmiRate: 0.75,
        lenderTitleRate: 2.0, appraisal: 600, inspection: 500,
        countyTaxRate: 0.5, stateTaxRate: 0.75, mortgageTaxRate: 0.375,
        prepaidEscrowRate: 2.0, attorneyFees: 750,
        movingCost: 1500, utilityDeposits: 350, furnishingsRate: 2.0,
        repairsRate: 1.0, reserveMonths: 3,
        scenarios: [{homePrice:225000,downPct:20},{homePrice:245000,downPct:20},{homePrice:265000,downPct:20}] }
    ];
  }

  (plannerState.goals || []).forEach(g => {
    if (!g.type) g.type = "generic";
    if (g.name === "Emergency Fund" && g.type === "generic") {
      g.type = "emergency"; g.baselineMonths = g.baselineMonths || 3; g.goalMonths = g.goalMonths || 6;
    }
    if ((g.name === "Home Down Payment" || g.name === "Home Purchase") && g.type === "generic") {

      g.interestRate = g.interestRate || 6.25; g.loanTermYears = g.loanTermYears || 30; g.hoaFee = g.hoaFee || 300;
      g.scenarios = g.scenarios || [{homePrice:225000,downPct:20},{homePrice:245000,downPct:20},{homePrice:265000,downPct:20}];
    }
    if (g.type === "home") {
      if (g.propTaxRate == null) g.propTaxRate = 1.7;
      if (g.hoiRate == null) g.hoiRate = 0.5;
      if (g.pmiRate == null) g.pmiRate = 0.75;
      if (g.lenderTitleRate == null) g.lenderTitleRate = 2.0;
      if (g.appraisal == null) g.appraisal = 600;
      if (g.inspection == null) g.inspection = 500;
      if (g.countyTaxRate == null) g.countyTaxRate = 0.5;
      if (g.stateTaxRate == null) g.stateTaxRate = 0.75;
      if (g.mortgageTaxRate == null) g.mortgageTaxRate = 0.375;
      if (g.prepaidEscrowRate == null) g.prepaidEscrowRate = 2.0;
      if (g.attorneyFees == null) g.attorneyFees = 750;
      if (g.movingCost == null) g.movingCost = 1500;
      if (g.utilityDeposits == null) g.utilityDeposits = 350;
      if (g.furnishingsRate == null) g.furnishingsRate = 2.0;
      if (g.repairsRate == null) g.repairsRate = 1.0;
      if (g.reserveMonths == null) g.reserveMonths = 3;
    }
  });

  migrateMisplacedTransactions();
  if (!activeMonthKey) activeMonthKey = formatMonthKey(new Date());
  ensureMonthExists(activeMonthKey);
  renderAll();
}

async function loadState() {
  try {
    const persistGranted = await requestPersistence();
    console.log("Persistence granted:", persistGranted);

    let raw = null;
    let source = "none";

    if (HAS_OPFS) {
      try {
        raw = await opfsRead();
        if (raw) { source = "opfs"; opfsAvailable = true; }
      } catch(e) { console.warn("OPFS read failed:", e); }
    }

    if (!raw) {
      try {
        raw = await idbGet(IDB_STATE, IDB_STATE_KEY);
        if (raw) source = "idb";
      } catch(e) { console.warn("IDB read failed:", e); }
    }

    if (!raw) {
      const ls = localStorage.getItem(STORAGE_KEY);
      if (ls) {
        raw = ls; source = "localStorage";
        try { await idbSet(IDB_STATE, IDB_STATE_KEY, raw); } catch(e) {}
        if (HAS_OPFS) {
          const wrote = await opfsWrite(raw);
          if (wrote) { opfsAvailable = true; }
        }
      }
    }

    const isFirstRun = !raw;
    applyStateObject(raw ? JSON.parse(raw) : {});

    console.log(`State loaded from: ${source}`);

    try {
      const ts = await idbGet(IDB_PREFS, "lastExportedAt");
      if (ts) lastExportedAt = new Date(ts);
    } catch(e) {}

    if (IS_STANDALONE) {
      setFileStatus(opfsAvailable ? "ios-pwa" : "ios-pwa");
    } else {
      setFileStatus("ios-browser");
      showPersistentIOSBar();
    }

    if (isFirstRun) {
      setTimeout(() => showFirstRunCard(), 300);
    } else {
      setTimeout(() => maybeShowBackupNudge(), 2000);
    }

  } catch(e) {
    console.error("loadState error:", e);
    applyStateObject({});
    setFileStatus("ios-browser");
  }
}

async function saveState() {
  clearTimeout(saveTimeout);
  saveTimeout = setTimeout(async () => {
    const data = JSON.stringify(buildStateObject());
    const writes = [];
    if (HAS_OPFS) {
      writes.push(opfsWrite(data).then(ok => { if (ok) opfsAvailable = true; }));
    }
    writes.push(idbSet(IDB_STATE, IDB_STATE_KEY, data).catch(e => console.warn("IDB save failed:", e)));
    try { localStorage.setItem(STORAGE_KEY, data); } catch(e) {}
    await Promise.allSettled(writes);
    updateStatusChip();
  }, 400);
}

async function exportSnapshot() {
  const nameInput = document.getElementById("backupFileNameInput");
  if (nameInput) {
    const trimmed = nameInput.value.trim();
    if (trimmed) customBackupName = trimmed;
  }
  const baseName      = (customBackupName || "finance-backup").replace(/\.json$/i, "");
  const suggestedName = `${baseName}.json`;
  const data          = JSON.stringify(buildStateObject(), null, 2);

  async function onExportSuccess() {
    lastExportedAt = new Date();
    try { await idbSet(IDB_PREFS, "lastExportedAt", lastExportedAt.toISOString()); } catch(e) {}
    setFileStatus("ios-backed");
    dismissBanner("backup-nudge-banner");
    setTimeout(() => {
      setFileStatus(IS_STANDALONE ? "ios-pwa" : "ios-browser");
    }, 5000);
    if (activeView === "settings") renderSettingsView();
  }

  if (typeof window.showSaveFilePicker === "function" && !IS_IOS) {
    try {
      const handle = await window.showSaveFilePicker({
        suggestedName,
        types: [{ description: "JSON Backup", accept: { "application/json": [".json"] } }]
      });
      const writable = await handle.createWritable();
      await writable.write(data);
      await writable.close();
      await onExportSuccess();
      return;
    } catch(e) {
      if (e.name === "AbortError") return;
    }
  }

  const url = URL.createObjectURL(new Blob([data], { type: "application/json" }));
  const a = Object.assign(document.createElement("a"), { href: url, download: suggestedName });
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 10000);
  await onExportSuccess();
}

function importStateFromFile(file) {
  const r = new FileReader();
  r.onload = e => {
    try {
      applyStateObject(JSON.parse(e.target.result));
      activeFileName = file.name;
      saveState();
      renderAll();
    } catch(_) { alert("Could not import file. Please ensure it is a valid Finance Tracker .json backup."); }
  };
  r.readAsText(file);
}

function categoryIcon(name) {
  const n = (name || "").toLowerCase();
  if (n.includes("rent") || n.includes("mortgage")) return "🏠";
  if (n.includes("electric") || n.includes("gas") || n.includes("water") || n.includes("heat")) return "⚡";
  if (n.includes("internet") || n.includes("phone") || n.includes("cell")) return "📱";
  if (n.includes("car") || n.includes("fuel") || n.includes("gas /")) return "🚗";
  if (n.includes("insurance") || n.includes("health")) return "🏥";
  if (n.includes("loan") || n.includes("credit")) return "💳";
  if (n.includes("netflix") || n.includes("hulu") || n.includes("spotify") || n.includes("youtube") || n.includes("streaming")) return "📺";
  if (n.includes("gym")) return "💪";
  if (n.includes("grocery") || n.includes("restaurant") || n.includes("food") || n.includes("takeout")) return "🍽";
  if (n.includes("shop") || n.includes("clothing")) return "🛍";
  if (n.includes("emergency") || n.includes("saving") || n.includes("401") || n.includes("ira") || n.includes("invest") || n.includes("brokerage")) return "💰";
  if (n.includes("vacation") || n.includes("travel")) return "✈️";
  return "•";
}

function quickLogTransaction(category, amount) {
  ensureMonthExists(activeMonthKey);
  const today = new Date().toISOString().slice(0, 10);
  // Use active month for date if not current month
  let dateISO = today;
  if (activeMonthKey !== formatMonthKey(new Date())) {
    const [y, m] = activeMonthKey.split("-");
    dateISO = `${y}-${m}-01`;
  }
  months[activeMonthKey].transactions.push({
    id: uid(),
    category,
    amount: Number(amount),
    dateISO,
    note: "Quick-logged"
  });
  saveState();
  renderActiveView();
}

    const mk = y + "-" + m;
    ensureMonthExists(mk);
    months[mk].transactions.push({ id: uid(), category, amount, dateISO, note });
    activeMonthKey = mk;
    showAddForm = false;
    saveState();
    renderAll();
  });

  // Search — live filter; restore focus after re-render
  const searchEl = document.getElementById("txSearch");
  searchEl?.addEventListener("input", e => {
    txSearch = e.target.value;
    renderLogView();
    const el = document.getElementById("txSearch");
    if (el) {
      el.focus();
      const len = el.value.length;
      el.setSelectionRange(len, len);
    }
  });

  document.getElementById("txFilter")?.addEventListener("change", e => {
    txFilterCat = e.target.value;
    renderLogView();
  });

  document.getElementById("txSort")?.addEventListener("change", e => {
    txSortOrder = e.target.value;
    renderLogView();
  });

  container.querySelectorAll("[data-edit-tx]").forEach(btn => {
    btn.addEventListener("click", () => { editingTxId = btn.dataset.editTx; renderLogView(); });
  });
  container.querySelectorAll("[data-cancel-edit]").forEach(btn => {
    btn.addEventListener("click", () => { editingTxId = null; renderLogView(); });
  });
  container.querySelectorAll("[data-save-edit]").forEach(btn => {
    btn.addEventListener("click", () => {
      const id = btn.dataset.saveEdit;
      const oldMk = btn.dataset.month;
      const list = months[oldMk]?.transactions || [];
      const idx = list.findIndex(t => t.id === id);
      if (idx === -1) return;

      const newAmount = Number(document.getElementById("editAmt")?.value || 0);
      const newDate = document.getElementById("editDate")?.value || list[idx].dateISO;
      const newCat = document.getElementById("editCat")?.value || list[idx].category;
      const newNote = document.getElementById("editNote")?.value?.trim() || "";

      const [y, m] = (newDate || "").split("-");
      const newMk = y && m ? `${y}-${m}` : oldMk;

      if (newMk !== oldMk) {
        // Move to the correct month
        const [moved] = list.splice(idx, 1);
        moved.amount = newAmount;
        moved.dateISO = newDate;
        moved.category = newCat;
        moved.note = newNote;
        ensureMonthExists(newMk);
        months[newMk].transactions.push(moved);
      } else {
        list[idx].amount = newAmount;
        list[idx].dateISO = newDate;
        list[idx].category = newCat;
        list[idx].note = newNote;
      }

      editingTxId = null;
      saveState();
      renderLogView();
    });
  });
  container.querySelectorAll("[data-del-tx]").forEach(btn => {
    btn.addEventListener("click", () => {
      if (!confirm("Delete this transaction?")) return;
      const id = btn.dataset.delTx;
      const mk = btn.dataset.month;
      if (!months[mk]) return;
      months[mk].transactions = (months[mk].transactions || []).filter(t => t.id !== id);
      saveState();
      renderLogView();
    });
  });

  document.getElementById("addIncomeBtn")?.addEventListener("click", () => {
    const label = document.getElementById("incomeLabel")?.value?.trim() || "Income";
    const amount = Number(document.getElementById("incomeAmount")?.value || 0);
    if (!amount) { alert("Enter an amount."); return; }
    ensureMonthExists(activeMonthKey);
    months[activeMonthKey].meta.incomeSources.push({ id: uid(), label, amount });
    saveState();
    renderLogView();
  });

  container.querySelectorAll("[data-del-income]").forEach(btn => {
    btn.addEventListener("click", () => {
      const id = btn.dataset.delIncome;
      months[activeMonthKey].meta.incomeSources =
        (months[activeMonthKey].meta.incomeSources || []).filter(s => s.id !== id);
      saveState();
      renderLogView();
    });
  });
}

function renderBudgetView() {
  const container = document.getElementById("budgetView");
  ensureMonthExists(activeMonthKey);

  const [y, m] = activeMonthKey.split("-").map(Number);
  const year = String(y);
  const isYear = budgetViewMode === "year";

  // Months in this year up to (and including) selected month for YTD,
  // or full year keys that exist when in year mode through selected month
  const monthKeysInScope = Object.keys(months)
    .filter(k => k.startsWith(year + "-"))
    .filter(k => isYear ? k <= activeMonthKey : k === activeMonthKey)
    .sort();

  // Number of months to multiply budgets by
  // Month mode → 1; Year mode → months from Jan through selected month
  const budgetMult = isYear ? m : 1;

  // Aggregate transactions in scope
  const scopedTxs = monthKeysInScope.flatMap(k => months[k]?.transactions || []);
  const rawActuals = computeActuals(scopedTxs);
  const allItems = getAllItems();
  const actuals = computeEffectiveActuals(rawActuals, allItems);
  const yearTxs = getYearTxs(activeMonthKey);

  function section(title, items) {
    if (!items.length) return "";
    const totalBudget = items.reduce((s, i) => s + Number(i.budgetAmount || 0) * budgetMult, 0);
    const totalActual = items.reduce((s, i) => s + (actuals[i.name] || 0), 0);
    return `
      <div class="budget-section">
        <div class="budget-section-header">
          <span class="budget-section-title">${title}</span>
          <span class="budget-section-total">${fmt(totalActual)} / ${fmt(totalBudget)}</span>
        </div>
        ${items.map(item => {
          const actual = actuals[item.name] || 0;
          const budget = Number(item.budgetAmount || 0) * budgetMult;
          const pct = budget ? Math.min((actual / budget) * 100, 100) : 0;
          const cls = progressClass(actual, budget);
          const color = progressColor(cls);
          const paid = item.annualEnabled && isAnnualPaid(item, yearTxs);
          const isSplit = item.splitEnabled && Number(item.splitFullAmount) > 0;
          const partnerBase = isSplit ? Math.max(0, Number(item.splitFullAmount) - Number(item.budgetAmount || 0)) : 0;
          const partnerAmt = partnerBase * budgetMult;
          const metaParts = [];
          if (paid) metaParts.push("Paid for the year");
          else if (item.annualEnabled) metaParts.push("Annual · saving " + fmt(Number(item.budgetAmount || 0)) + "/mo");
          if (isSplit && !paid) metaParts.push("Partner " + fmt(partnerAmt));
          return `
            <div class="budget-item">
              <div class="budget-item-row">
                <div class="budget-item-name">${item.name}${paid ? " ✓" : ""}</div>
                <div class="budget-item-amounts">
                  <span class="budget-actual" style="color:${color}">${fmt(actual)}</span>
                  <span class="budget-limit"> / ${budget ? fmt(budget) : "—"}</span>
                </div>
              </div>
              ${budget ? `<div class="progress-track"><div class="progress-fill ${cls}" style="width:${paid ? 100 : pct}%"></div></div>` : ""}
              ${metaParts.length ? `<div style="font-size:11px;color:var(--text-3);margin-top:4px;">${metaParts.join(" · ")}</div>` : ""}
            </div>`;
        }).join("")}
      </div>`;
  }

  const bills  = appSettings.recurringBills || [];
  const subs   = appSettings.recurringSubscriptions || [];
  const invsts = appSettings.recurringInvestments || [];
  const disc   = (appSettings.discretionaryCategories || []).filter(i =>
    Number(i.budgetAmount) > 0 || (actuals[i.name] || 0) > 0
  );

  const navLabel = isYear
    ? `${year} · through ${formatMonthLabelFromKey(activeMonthKey).split(" ")[0]}`
    : formatMonthLabelFromKey(activeMonthKey);

  container.innerHTML = `
    <div class="mode-toggle">
      <button class="mode-btn ${!isYear ? "active" : ""}" data-mode="month">Month</button>
      <button class="mode-btn ${isYear ? "active" : ""}" data-mode="year">Year</button>
    </div>

    <div class="month-nav" style="margin-bottom:14px;">
      <button class="month-nav-btn" id="budPrev">‹</button>
      <div>
        <div class="month-nav-label">${navLabel}</div>
      </div>
      <button class="month-nav-btn" id="budNext">›</button>
    </div>

    <div class="card">
      ${section("Must Pay", bills)}
      ${section("Subscriptions", subs)}
      ${section("Savings", invsts)}
      ${disc.length ? section("Spending", disc) : ""}
      ${!bills.length && !subs.length && !invsts.length && !disc.length
        ? `<div class="empty">No budget items yet. Add them in Settings.</div>` : ""}
    </div>
  `;

  container.querySelectorAll("[data-mode]").forEach(btn => {
    btn.addEventListener("click", () => {
      budgetViewMode = btn.dataset.mode;
      renderBudgetView();
    });
  });

  document.getElementById("budPrev")?.addEventListener("click", () => {
    if (isYear) {
      // Previous year, keep same month number if possible
      activeMonthKey = formatMonthKey(new Date(y - 1, m - 1, 1));
    } else {
      activeMonthKey = formatMonthKey(new Date(y, m - 2, 1));
    }
    ensureMonthExists(activeMonthKey);
    renderAll();
  });
  document.getElementById("budNext")?.addEventListener("click", () => {
    const thisKey = formatMonthKey(new Date());
    let next;
    if (isYear) {
      next = formatMonthKey(new Date(y + 1, m - 1, 1));
    } else {
      next = formatMonthKey(new Date(y, m, 1));
    }
    if (next <= thisKey) {
      activeMonthKey = next;
      ensureMonthExists(activeMonthKey);
      renderAll();
    }
  });
}

function goalProjection(g) {
  const current = Number(g.currentAmount || 0);
  const target  = Number(g.targetAmount || 0);
  const monthly = Number(g.monthlyContribution || 0);
  if (!target || target <= current) return { monthsLeft: 0, projectedDate: "Done" };
  if (!monthly) return { monthsLeft: null, projectedDate: "—" };
  const monthsLeft = Math.ceil((target - current) / monthly);
  const d = new Date(); d.setMonth(d.getMonth() + monthsLeft);
  return {
    monthsLeft,
    projectedDate: d.toLocaleString(undefined, { month: "short", year: "numeric" })
  };
}

} else if (g.type === "retirement") {
              const cur = Number(g.retCurrentSavings ?? g.currentAmount ?? 0);
              sub = fmt(cur) + " · age " + (g.retCurrentAge || 35);
            } else if (g.type === "home") {
              const cur = Number(g.currentSavings || 0);
              sub = fmt(cur) + " saved";

              const bal = Number(g.debtBalance ?? g.currentAmount ?? 0);
              const orig = Number(g.debtOriginal || bal);
              pct = orig > 0 ? Math.min(((orig - bal) / orig) * 100, 100) : 0;

            } else if (g.type === "investment") {
              const cur = Number(g.currentAmount || 0);

                </div>

                  <div class="goal-arrow">›</div>
                </div>
              </div>`;
          }).join("")
      }
    </div>
    <p class="text-muted" style="text-align:center;font-size:12px;">Tap a goal for details & projections</p>
  `;

  container.querySelectorAll("[data-open-goal]").forEach(el => {
    el.addEventListener("click", () => {
      activeGoalId = el.dataset.openGoal;
      renderGoalsView();

  });
}

function renderGoalDetail(container, g) {
  // Simplified detail views — keep the valuable calculators but present more calmly
  let body = "";

  if (g.type === "emergency") {
    const cur = Number(g.currentAmount || 0);
    const baseline = Math.min(12, Math.max(1, Number(g.baselineMonths || 3)));
    const goalM = Math.min(12, Math.max(1, Number(g.goalMonths || 6)));

    // Must Pay only (your share) — subscriptions excluded from emergency coverage
const mustPay = (appSettings.recurringBills || []).reduce((s, i) => s + Number(i.budgetAmount || 0), 0);
const monthlyEssential = mustPay;

    const baselineTarget = monthlyEssential * baseline;
    const goalTarget = monthlyEssential * goalM;
    const pct = goalTarget > 0 ? Math.min((cur / goalTarget) * 100, 100) : 0;
    const monthsCovered = monthlyEssential > 0 ? cur / monthlyEssential : 0;

    // Progressive 1–12 month rows
    let ladderHtml = "";
    for (let mo = 1; mo <= 12; mo++) {
      const target = monthlyEssential * mo;
      const barPct = target > 0 ? Math.min((cur / target) * 100, 100) : 0;
      const reached = cur >= target;
      const isBase = mo === baseline;
      const isGoal = mo === goalM;
      let rowBg = "transparent";
      let labelExtra = "";
      let valueColor = "var(--text)";
      if (isBase && isGoal) {
        rowBg = "rgba(96,165,250,0.10)";
        labelExtra = " · baseline & goal";
        valueColor = "var(--accent)";
      } else if (isBase) {
        rowBg = "rgba(251,191,36,0.10)";
        labelExtra = " · baseline";
        valueColor = "var(--amber)";
      } else if (isGoal) {
        rowBg = "rgba(96,165,250,0.10)";
        labelExtra = " · goal";
        valueColor = "var(--accent)";
      }
      ladderHtml += `
        <div style="display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;background:${rowBg};margin-bottom:2px;">

          <div style="flex:1;min-width:0;">
            <div class="progress-track" style="height:5px;">
              <div class="progress-fill" style="width:${barPct}%;background:${reached ? "var(--green)" : isGoal ? "var(--accent)" : isBase ? "var(--amber)" : "rgba(148,163,184,0.35)"};"></div>
            </div>
          </div>
          <div style="width:72px;text-align:right;font-size:12px;font-weight:700;color:${valueColor};flex-shrink:0;">
            ${fmtShort(target)}
          </div>
          <div style="width:18px;text-align:center;flex-shrink:0;font-size:12px;">
            ${reached ? "✓" : ""}
          </div>
        </div>`;
      // labelExtra intentionally not rendered as text to keep rows tight;
      // baseline/goal are indicated by row highlight + color
    }

    body = `
      <div class="card">
        <div style="text-align:center;padding:8px 0 16px;">
          <div class="hero-number text-accent">${fmt(cur)}</div>
          <div class="hero-label">Current balance · ${monthsCovered > 0 ? monthsCovered.toFixed(1) + " months covered" : "no coverage yet"}</div>
        </div>
        <div class="goal-stat-grid">

            <div class="goal-stat-value" style="color:var(--amber);">${monthlyEssential ? fmt(baselineTarget) : "—"}</div>
          </div>

            <div class="goal-stat-label">${goalM}-mo goal</div>
            <div class="goal-stat-value" style="color:var(--accent);">${monthlyEssential ? fmt(goalTarget) : "—"}</div>
          </div>
        </div>
        ${goalTarget > 0 ? `
          <div class="progress-track" style="height:8px;margin-bottom:6px;">
            <div class="progress-fill ${pct >= 100 ? "under" : pct >= 50 ? "warn" : "unset"}" style="width:${pct}%"></div>
          </div>
          <div style="text-align:center;font-size:13px;color:var(--text-2);margin-bottom:4px;">${pct.toFixed(0)}% of ${goalM}-month goal</div>
        ` : ""}
      </div>

      <div class="card">
        <div class="card-header-row">
          <div class="card-title" style="margin:0">Coverage ladder</div>
          <div style="text-align:right;">
            <div style="font-size:14px;font-weight:700;color:var(--text);">${fmt(monthlyEssential)}/mo</div>

             <div style="display:flex;gap:12px;justify-content:center;margin-top:10px;font-size:11px;color:var(--text-3);">

      if (r === 0) return principal + monthly * n;
      return principal * Math.pow(1 + r, n) + monthly * ((Math.pow(1 + r, n) - 1) / r);

      if (n >= 1e3) return "$" + (n / 1e3).toFixed(0) + "K";
      return "$" + Number(n).toFixed(0);

    const retBal = fv(currentSavings, monthlyContrib, expectedReturn, yearsToRetire);
const monthlyIncome = retBal * withdrawalRate / 12;

const retBalReal = yearsToRetire > 0

const monthlyIncomeReal = retBalReal * withdrawalRate / 12;

    body = `

  </div>
</div>
      <div class="card">
        <div class="card-title">Your numbers</div>
        <div class="input-grid-2">

          </div>
          <div>
            <label class="form-label">Monthly contribution</label>
            <input class="form-input" id="retContrib" type="number" step="50" value="${monthlyContrib}">
          </div>
          <div>
            <label class="form-label">Current age</label>
            <input class="form-input" id="retAge" type="number" value="${currentAge}">
          </div>
          <div>
            <label class="form-label">Retirement age</label>

          </div>
        </div>

        <div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--border);">
  <div class="form-label" style="margin-bottom:8px;">Assumptions</div>
  <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;">
    <div>
      <label class="form-label" style="font-size:10px;">Return %</label>
      <input class="form-input" id="retReturn" type="number" step="0.1" min="0" max="15" value="${expectedReturn}">
    </div>
    <div>
      <label class="form-label" style="font-size:10px;">Inflation %</label>
      <input class="form-input" id="retInflation" type="number" step="0.1" min="0" max="10" value="${(inflationRate*100)}">
    </div>
    <div>
      <label class="form-label" style="font-size:10px;">Withdraw %</label>
      <input class="form-input" id="retWithdraw" type="number" step="0.1" min="0" max="10" value="${(withdrawalRate*100)}">
    </div>
  </div>
</div>
        <button class="btn" id="saveRet">Update projections</button>
      </div>
      <div class="card">
        <div class="card-title">Growth scenarios</div>
        <div style="overflow-x:auto;">
          <table class="ret-table">
            <thead>
              <tr>
                <th></th>
                <th style="color:var(--text-3)">4%</th>
                <th style="color:var(--amber)">6%</th>
                <th style="color:var(--accent)">7%</th>
                <th style="color:var(--green)">8%</th>
              </tr>
            </thead>
            <tbody>
              ${[5,10,15,20, yearsToRetire].filter((v,i,a) => a.indexOf(v) === i && v > 0).sort((a,b)=>a-b).map(yrs => {
                const isRet = yrs === yearsToRetire;
                return `<tr class="${isRet ? "ret-row-retire" : ""}">
                  <td>${isRet ? "🎯 " : ""}Age ${currentAge + yrs}</td>
                  <td>${fmtBig(fv(currentSavings, monthlyContrib, 4, yrs))}</td>
                  <td>${fmtBig(fv(currentSavings, monthlyContrib, 6, yrs))}</td>
                  <td>${fmtBig(fv(currentSavings, monthlyContrib, 7, yrs))}</td>
                  <td>${fmtBig(fv(currentSavings, monthlyContrib, 8, yrs))}</td>
                </tr>`;
              }).join("")}
            </tbody>
          </table>
        </div>
      </div>`;
  } else if (g.type === "debt") {
    const balance = Number(g.debtBalance ?? g.currentAmount ?? 0);
    const origBal = Number(g.debtOriginal ?? balance);
    const apr = Number(g.debtApr ?? 0);
    const minPmt = Number(g.debtMinPmt ?? 0);
    const yourPmt = Number(g.debtYourPmt ?? minPmt);
    const monthRate = apr / 100 / 12;
    const paidOff = Math.max(0, origBal - balance);
    const pct = origBal > 0 ? Math.min((paidOff / origBal) * 100, 100) : 0;

    function monthsTo(bal, rate, pmt) {
      if (pmt <= 0 || bal <= 0) return null;
      if (rate === 0) return Math.ceil(bal / pmt);
      if (pmt <= bal * rate) return null;
      return Math.ceil(-Math.log(1 - (bal * rate) / pmt) / Math.log(1 + rate));
    }
    const yourMonths = monthsTo(balance, monthRate, yourPmt);

    body = `
      <div class="card">
        <div class="card-title">Payoff status</div>
        <div style="display:flex;justify-content:space-between;margin-bottom:6px;">
          <span style="font-weight:700;color:var(--red)">${fmt(balance)} left</span>
          <span class="text-muted">${fmt(origBal)} original</span>
        </div>
        <div class="progress-track" style="height:8px;margin-bottom:8px;">
          <div class="progress-fill" style="width:${pct}%;background:${pct>=80?"var(--green)":pct>=40?"var(--amber)":"var(--red)"}"></div>
        </div>
        <div style="text-align:center;font-size:13px;color:var(--text-2)">${pct.toFixed(0)}% paid off</div>
        ${yourMonths !== null ? `
          <div class="goal-stat-grid" style="margin-top:16px;">
            <div class="goal-stat">
              <div class="goal-stat-label">Months to go</div>
              <div class="goal-stat-value text-accent">${yourMonths}</div>
            </div>
            <div class="goal-stat">
              <div class="goal-stat-label">Your payment</div>
              <div class="goal-stat-value">${fmt(yourPmt)}</div>
            </div>
          </div>
        ` : ""}
      </div>
      <div class="card">
        <div class="card-title">Update</div>
        <div class="input-grid-2">
          <div><label class="form-label">Original balance</label><input class="form-input" id="debtOrig" type="number" value="${origBal}"></div>
          <div><label class="form-label">Current balance</label><input class="form-input" id="debtBal" type="number" value="${balance}"></div>
          <div><label class="form-label">APR %</label><input class="form-input" id="debtApr" type="number" step="0.01" value="${apr}"></div>
          <div><label class="form-label">Min payment</label><input class="form-input" id="debtMin" type="number" value="${minPmt}"></div>
          <div class="full"><label class="form-label">Your payment</label><input class="form-input" id="debtYour" type="number" value="${yourPmt}"></div>
        </div>
        <button class="btn" id="saveDebt">Update</button>
      </div>`;
      } else if (g.type === "home") {
    const current = Number(g.currentSavings || 0);
    const downPct = Number(g.scenarios?.[0]?.downPct || 20);
    const rate = Number(g.interestRate || 6.25);
    const term = Number(g.loanTermYears || 30);
    const hoa = Number(g.hoaFee || 0);
    const propTaxRate = Number(g.propTaxRate || 1.7);
    const hoiRate = Number(g.hoiRate || 0.5);
    const priceLow = Number(g.priceLow || 200000);
    const priceHigh = Number(g.priceHigh || 300000);
    const homePrice = Math.round(((priceLow + priceHigh) / 2) / 1000) * 1000; // midpoint

    function calcForPrice(price) {
      const down = price * (downPct / 100);
      const loan = price - down;
      const r = rate / 100 / 12;
      const n = term * 12;
      const pi = r === 0 ? loan / n
        : loan * (r * Math.pow(1 + r, n)) / (Math.pow(1 + r, n) - 1);
      const tax = (price * (propTaxRate / 100)) / 12;
      const ins = (price * (hoiRate / 100)) / 12;
      const monthly = pi + tax + ins + hoa;
      const cash = down + price * 0.03;
      return { down, monthly, cash };
    }

    const primary = calcForPrice(homePrice);
const stillNeeded = Math.max(0, primary.cash - current);
const pctToGoal = primary.cash > 0 ? Math.min((current / primary.cash) * 100, 100) : 0;

    // 5 evenly spaced price points
    const pricePoints = [];
    for (let i = 0; i < 5; i++) {
      pricePoints.push(Math.round((priceLow + (priceHigh - priceLow) * (i / 4)) / 1000) * 1000);
    }

    const tableRows = pricePoints.map(p => {
      const c = calcForPrice(p);
      const isPrimary = Math.abs(p - homePrice) < 1;
      return `<tr class="${isPrimary ? "ret-row-retire" : ""}">
        <td>${isPrimary ? "🎯 " : ""}${fmtShort(p)}</td>
        <td>${fmtShort(c.down)}</td>
        <td>${fmtShort(c.cash)}</td>
        <td>${fmtShort(c.monthly)}</td>
      </tr>`;
    }).join("");

    body = `
      <div class="card">
  <div class="card-title">Selected target</div>

  <!-- Primary metrics -->
  <div class="goal-stat-grid" style="margin-bottom:4px;">
    <div class="goal-stat">
      <div class="goal-stat-label">Cash to close</div>
      <div class="goal-stat-value text-accent" style="font-size:20px;">${fmt(primary.cash)}</div>
    </div>
    <div class="goal-stat">
      <div class="goal-stat-label">Still to save</div>
      <div class="goal-stat-value" style="font-size:20px;">${stillNeeded > 0 ? fmt(stillNeeded) : "Done"}</div>
    </div>
  </div>

  <div class="progress-track" style="height:8px;margin:10px 0 6px;">
    <div class="progress-fill ${pctToGoal >= 100 ? "under" : pctToGoal >= 50 ? "warn" : "unset"}" style="width:${pctToGoal}%"></div>
  </div>
  <div style="text-align:center;font-size:13px;color:var(--text-2);margin-bottom:14px;">
    ${pctToGoal.toFixed(0)}% of cash needed · ${fmt(current)} saved
  </div>

  <!-- Secondary metrics -->
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;padding-top:12px;border-top:1px solid var(--border);">
    <div>
      <div style="font-size:10px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:0.3px;margin-bottom:2px;">Down payment</div>
      <div style="font-size:15px;font-weight:600;color:var(--text-2);">${fmt(primary.down)}</div>
    </div>
    <div>
      <div style="font-size:10px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:0.3px;margin-bottom:2px;">Monthly payment</div>
      <div style="font-size:15px;font-weight:600;color:var(--text-2);">${fmt(primary.monthly)}</div>
    </div>
  </div>
</div>

      <div class="card">
        <div class="card-title">Target home</div>
        <div class="input-grid-2">
          <div class="full">
            <label class="form-label">Current savings</label>
            <input class="form-input" id="homeSavings" type="number" step="500" value="${current}">
          </div>
          <div>
  <label class="form-label">Down payment %</label>
  <input class="form-input" id="homeDownPct" type="number" step="1" min="0" max="100" value="${downPct}">
</div>
          <div>
            <label class="form-label">Interest rate %</label>
            <input class="form-input" id="homeRate" type="number" step="0.125" value="${rate}">
          </div>
          <div>
            <label class="form-label">Loan term (years)</label>
            <input class="form-input" id="homeTerm" type="number" step="1" value="${term}">
          </div>
          <div>
            <label class="form-label">Price range low</label>
            <input class="form-input" id="homePriceLow" type="number" step="5000" value="${priceLow}">
          </div>
          <div>
            <label class="form-label">Price range high</label>
            <input class="form-input" id="homePriceHigh" type="number" step="5000" value="${priceHigh}">
          </div>
        </div>
        <button class="btn" id="saveHome" style="margin-top:12px;">Update</button>
      </div>

      <div class="card">
        <div class="card-title">Price scenarios</div>
        <div style="overflow-x:auto;">
          <table class="ret-table">
            <thead>
              <tr>
                <th style="text-align:left">Price</th>
                <th>Down</th>
                <th>Cash to close</th>
                <th>Monthly</th>
              </tr>
            </thead>
            <tbody>
              ${tableRows}
            </tbody>
          </table>
        </div>
        <div style="margin-top:10px;font-size:11px;color:var(--text-3);line-height:1.4;">
          Uses your selected down %, rate & term. Cash to close ≈ down payment + 3% closing costs.
          Monthly includes principal, interest, tax, insurance & HOA.
        </div>
      </div>
    `;
  } else {
    // Generic / investment
    const current = Number(g.currentAmount || 0);
    const target = Number(g.targetAmount || 0);
    const monthly = Number(g.monthlyContribution || 0);
    const pct = target ? Math.min((current / target) * 100, 100) : 0;
    const proj = goalProjection(g);

    body = `
      <div class="card">
        <div style="display:flex;justify-content:space-between;margin-bottom:6px;">
          <span style="font-weight:700;color:var(--accent)">${fmt(current)}</span>
          <span class="text-muted">${fmt(target)} goal</span>
        </div>
        <div class="progress-track" style="height:8px;margin-bottom:8px;">
          <div class="progress-fill" style="width:${pct}%;background:${pct>=100?"var(--green)":pct>=80?"var(--amber)":"var(--accent)"}"></div>
        </div>
        <div style="text-align:center;font-size:20px;font-weight:700;color:var(--accent)">${pct.toFixed(0)}%</div>
        <div class="goal-stat-grid" style="margin-top:16px;">
          <div class="goal-stat">
            <div class="goal-stat-label">Remaining</div>
            <div class="goal-stat-value">${fmt(Math.max(0, target - current))}</div>
          </div>
          <div class="goal-stat">
            <div class="goal-stat-label">Projected</div>
            <div class="goal-stat-value" style="font-size:14px;">${proj.projectedDate}</div>
          </div>
        </div>
      </div>
      <div class="card">
        <div class="card-title">Update</div>
        <div class="input-grid-2">
          <div><label class="form-label">Current</label><input class="form-input" id="genCurrent" type="number" value="${current}"></div>
          <div><label class="form-label">Target</label><input class="form-input" id="genTarget" type="number" value="${target}"></div>
          <div class="full"><label class="form-label">Monthly contribution</label><input class="form-input" id="genMonthly" type="number" value="${monthly}"></div>
        </div>
        <button class="btn" id="saveGen">Save</button>
      </div>`;
  }

  container.innerHTML = `
    <button class="back-link" id="backToGoals">‹ All goals</button>
    <h2 style="font-size:18px;font-weight:700;margin-bottom:16px;">${g.icon || ""} ${g.name}</h2>
    ${body}
    <div style="text-align:center;margin-top:16px;">
      <button class="btn btn-sm btn-danger" id="deleteGoal">Delete goal</button>
    </div>
  `;

  document.getElementById("backToGoals")?.addEventListener("click", () => {
    activeGoalId = null;
    renderGoalsView();
  });
  document.getElementById("deleteGoal")?.addEventListener("click", () => {
    if (!confirm("Delete this goal?")) return;
    plannerState.goals = plannerState.goals.filter(x => x.id !== g.id);
    activeGoalId = null;
    saveState();
    renderGoalsView();
  });

  // Save handlers
  document.getElementById("saveEf")?.addEventListener("click", () => {
    g.currentAmount = Number(document.getElementById("efCurrent")?.value || 0);
    g.baselineMonths = Number(document.getElementById("efBase")?.value || 3);
    g.goalMonths = Number(document.getElementById("efGoal")?.value || 6);
    saveState();
    renderGoalsView();
  });
  document.getElementById("saveRet")?.addEventListener("click", () => {
    g.retCurrentSavings = Number(document.getElementById("retSavings")?.value || 0);
    g.retMonthlyContrib = Number(document.getElementById("retContrib")?.value || 0);
    g.retCurrentAge = Number(document.getElementById("retAge")?.value || 35);
    g.retRetirementAge = Number(document.getElementById("retRetAge")?.value || 65);
    g.currentAmount = g.retCurrentSavings;
    g.monthlyContribution = g.retMonthlyContrib;
    g.retExpectedReturn = Number(document.getElementById("retReturn")?.value || 6);
    g.retInflation = Number(document.getElementById("retInflation")?.value || 3);
    g.retWithdrawalRate = Number(document.getElementById("retWithdraw")?.value || 3.5);
    saveState();
    renderGoalsView();
  });
  document.getElementById("saveDebt")?.addEventListener("click", () => {
    g.debtOriginal = Number(document.getElementById("debtOrig")?.value || 0);
    g.debtBalance = Number(document.getElementById("debtBal")?.value || 0);
    g.debtApr = Number(document.getElementById("debtApr")?.value || 0);
    g.debtMinPmt = Number(document.getElementById("debtMin")?.value || 0);
    g.debtYourPmt = Number(document.getElementById("debtYour")?.value || 0);
    g.currentAmount = g.debtBalance;
    saveState();
    renderGoalsView();
  });
    document.getElementById("saveHome")?.addEventListener("click", () => {
  g.currentSavings = Number(document.getElementById("homeSavings")?.value || 0);
  const down = Number(document.getElementById("homeDownPct")?.value || 20);
  const low = Number(document.getElementById("homePriceLow")?.value || 200000);
  const high = Number(document.getElementById("homePriceHigh")?.value || 300000);
  const mid = Math.round(((low + high) / 2) / 1000) * 1000;
  g.priceLow = low;
  g.priceHigh = high;
  g.scenarios = g.scenarios || [{}];
  g.scenarios[0] = { ...(g.scenarios[0] || {}), homePrice: mid, downPct: down };
  g.interestRate = Number(document.getElementById("homeRate")?.value || 6.25);
  g.loanTermYears = Number(document.getElementById("homeTerm")?.value || 30);
  saveState();
  renderGoalsView();
  });
}
